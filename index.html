<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nobuaki Satoh</title>
<style id="css">
/* VOICE quiet and strange: one dark room with things hanging in it
   IDEA cloth banners: the composer's video and photos printed on fabric, pinned up and swaying, pushed by the visitor's hand
   PICTURE the hanging cloths, drawn live in WebGL across the whole screen
   COLOUR near-black #0f0f0f, grey text #a0a0a0, white links, black bottom bar
   TYPE Helvetica Neue, small: names and titles bold, everything else regular, dates grey
   LAYOUT one screen: name top centre, short text centred, bar at the bottom opens each section over the room */
:root{color-scheme:dark;--bg:#0f0f0f;--ink:#a0a0a0;--hi:#fff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none}
a{color:var(--hi);text-decoration:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;z-index:1}
#gl.grab{cursor:grabbing}
#bust{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bctl{position:fixed;top:14px;right:max(3vw,16px);z-index:3;display:flex;gap:0 6px}
#bctl button{width:40px;height:40px;border:0;padding:0;cursor:pointer;background:none;position:relative}
#bctl button::after{content:"";position:absolute;inset:13px;border:1px solid var(--hi);transition:transform .3s}
#bSkin::after{border-radius:50%;background:rgb(255 255 255/calc(1 - var(--k,0)))}
#bMode{transition:transform .3s}
#bctl button:hover::after{transform:scale(1.25)}
#logo{position:fixed;top:18px;left:max(3vw,16px);right:max(3vw,16px);text-align:left;pointer-events:none;z-index:2}
#logo b{font-weight:400;font-size:14px;line-height:1.4;color:var(--hi);display:block}
#logo span{display:block;font-size:14px;color:var(--ink)}
#logo span:empty{display:none}
#desc{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,60vw);text-align:center;z-index:0;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#desc h1{font-size:14px;font-weight:400;line-height:1.4;margin:0}
#desc p{margin:10px 0 0;font-size:14px}
#desc p b{color:var(--hi);font-weight:400}
.barb{position:fixed;left:0;right:0;bottom:0;min-height:4rem;background:#000;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:2px 22px;padding:8px max(3vw,16px)}
.barb button,.barb a{background:none;border:0;color:var(--hi);font:inherit;font-size:14px;font-weight:400;text-decoration:none;cursor:pointer;padding:8px 2px;min-height:40px}
.barb .s{color:var(--ink);font-weight:400;margin-left:auto}
.barb .s+.s{margin-left:0}
.barb .s:hover,.barb button:hover{color:var(--hi)}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-52%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 9.5rem);overflow-y:auto;background:rgb(15 15 15/.94);border:1px solid #2a2a2a;padding:28px clamp(18px,4vw,36px);z-index:4;display:none;touch-action:pan-y}
#panel.on{display:block}
#panel.wide{width:min(1000px,calc(100% - 24px))}
.pf img{width:100%;display:block;margin:0 0 12px;background:#000}
#panel h2{color:var(--hi);font-weight:400;font-size:14px;margin:0 0 14px}
#panel h3{color:var(--ink);font-weight:400;font-size:14px;margin:20px 0 4px}
#panel .x{position:sticky;top:-10px;float:right;background:none;border:0;color:var(--hi);font:inherit;font-size:14px;line-height:1;cursor:pointer;min-width:44px;min-height:44px;margin:-14px -14px 0 0}
#panel ul{list-style:none;margin:0;padding:0}
#panel li{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:0 14px;padding:7px 0;border-bottom:1px solid #222}
#panel li.w{grid-template-columns:minmax(0,1fr) auto}
#panel .t{color:var(--hi)}
.when{white-space:nowrap;font-variant-numeric:tabular-nums}
li.up .when{color:var(--hi)}
.prices{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0}
.prices b{color:var(--hi);font-weight:400;white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
#panel .set li{grid-template-columns:72px minmax(0,1fr);align-items:center}
.set .th img,.set .th video{width:72px;height:48px;object-fit:cover;display:block;background:#000}
.set input{width:100%;background:#000;color:var(--hi);border:1px solid #333;font:inherit;padding:8px}
.sbtn{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.sbtn button{background:none;color:var(--hi);border:1px solid #444;font:inherit;padding:8px 14px;min-height:40px;cursor:pointer}
#logo b,#panel h2,#panel .t,.barb button,.barb a,.prices b,#desc p b{font-weight:700}
#panel h3{margin-top:22px}
.ed1 label{display:block;margin:0 0 10px;color:var(--ink)}
.ed1 input,.ed1 textarea,.er input{display:block;width:100%;background:#000;color:var(--hi);border:1px solid #333;font:inherit;padding:7px;margin-top:4px}
.ed1 label input[data-p]{display:inline-block;width:32%;margin-right:1%;vertical-align:top}
.er{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-bottom:1px solid #222}
.er input{margin:0;flex:1 1 120px;width:auto}
.er button{flex:0 0 36px}
.er button{background:none;border:1px solid #333;color:var(--hi);font:inherit;cursor:pointer}
.pw{display:block;margin:18px 0 0}.pw input{display:block;width:min(320px,100%);background:#000;color:var(--hi);border:1px solid #333;font:inherit;padding:7px;margin-top:4px}
#hint{position:fixed;right:max(3vw,16px);bottom:4.8rem;text-align:right;font-size:15px;color:#666;z-index:2;pointer-events:none;transition:opacity .6s}
@media(max-width:600px){#panel li{grid-template-columns:minmax(0,1fr)}#panel li.w{grid-template-columns:minmax(0,1fr) auto}#hint{display:none}.barb{gap:0 12px}}
</style>
</head>
<body>
<div id="shell">
<canvas id="gl" aria-label="Hanging cloths printed with Nobuaki Satoh's video and photos. Drag to move them."></canvas>

</div>

<script id="main-js">
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https:\/\//.test(u||'')?u:'';
const flagSrc=f=>f.id?'/_blob/'+encodeURIComponent(f.id):(/^(data:image\/|(img|gif|vid)\/[\w.-]+$|hero\.mp4$)/.test(f.src||'')?f.src:'');
let S=JSON.parse($('state').textContent);
let draft=null,openP=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=d=>{const p=(d||'').split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0].slice(2):d};
const today=new Date().toISOString().slice(0,10);
const row=(when,t,d,up,link)=>`<li class="${up?'up':''}"><span class="when">${esc(when)}</span><span>${safeUrl(link)?`<a class="t" href="${esc(link)}" target="_blank" rel="noopener">${esc(t)}</a>`:`<span class="t">${esc(t)}</span>`}${d?' '+esc(d):''}</span></li>`;
const cur=()=>draft||S;
const PANELS={
works:s=>`<h2 id="pT">WORK</h2><div class="pf">${(s.portfolio||[]).filter(u=>/^pf\/[\w.-]+$/.test(u)).map((u,i)=>`<img src="${esc(u)}" alt="Portfolio page ${i+1}" loading="lazy">`).join('')}</div><h3>Works</h3><ul>${s.works.map(w=>`<li class="w"><span><span class="t">${esc(w.title)}</span>${w.jp?' '+esc(w.jp):''}${w.inst?' '+esc(w.inst):''}</span><span>${esc(w.year)}</span></li>`).join('')}</ul>`,
concerts:s=>{const by={};[...s.concerts].sort((a,b)=>a.date<b.date?1:-1).forEach(c=>{const y=(c.date||'').slice(0,4);(by[y]=by[y]||[]).push(c)});return `<h2 id="pT">Concerts and premieres</h2>`+Object.keys(by).sort().reverse().map(y=>`<h3>${esc(y)}</h3><ul>${by[y].map(c=>row(c.when||fmt(c.date),c.title,c.text,false,c.link)).join('')}</ul>`).join('')},
schedule:s=>{const sch=[...s.schedule].sort((a,b)=>a.date<b.date?-1:1),up=sch.filter(e=>e.date>=today),past=sch.filter(e=>e.date<today).reverse();return `<h2 id="pT">Schedule</h2>`+(up.length?`<h3>Upcoming</h3><ul>${up.map(e=>row(fmt(e.date),e.title,e.text,true,e.link)).join('')}</ul>`:'<p>No upcoming dates right now.</p>')+(past.length?`<h3>Past</h3><ul>${past.map(e=>row(fmt(e.date),e.title,e.text,false,e.link)).join('')}</ul>`:'')},
scores:s=>`<h2 id="pT">Scores</h2><p>${esc(s.scoreText)}</p><div class="prices">${[['solo','Solo works'],['chamber','Chamber works'],['orch','Orchestral works']].map(([k,l])=>`<span>${l} <b>${esc(s.prices[k])}</b></span>`).join('')}</div><p>To buy a work or ask a question, email <span class="t">${esc(s.email)}</span>.</p>`,
contact:s=>`<h2 id="pT">Contact</h2><p>Email <span class="t">${esc(s.email)}</span></p><p>All of my videos are on YouTube.</p><p>${s.links.filter(l=>safeUrl(l.url)).map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join(' &nbsp; ')}</p>`};
/* settings (Shift+S or #settings): edit texts, lists and picture links; saved in this browser, and written into a fresh index.html to upload */
const STATE_VER=String([...$('state').textContent].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7));
const LS='ns-state';
try{const L=JSON.parse(localStorage.getItem(LS)||'null');if(L&&L.v===STATE_VER&&L.s&&Array.isArray(L.s.flags))S=L.s}catch(_){}
/* live saving: on the real site, /api/state (Cloudflare Pages Function + KV) holds the edited texts and links */
const EDIT_KEYS=['intro','email','scoreText','prices','schedule','concerts','works'];
let apiOK=false;
const pack=()=>{const o={};EDIT_KEYS.forEach(k=>o[k]=S[k]);o.links={};S.flags.forEach(f=>{o.links[f.src||f.id]=f.link||''});return o};
const unpack=o=>{EDIT_KEYS.forEach(k=>{if(o[k]!=null)S[k]=o[k]});if(o.links&&typeof o.links==='object')S.flags.forEach(f=>{const k=f.src||f.id;if(k in o.links){if(o.links[k])f.link=o.links[k];else delete f.link}})};
fetch('api/state',{cache:'no-store'}).then(r=>r.ok&&/json/.test(r.headers.get('content-type')||'')?r.json():null).then(o=>{if(!o)return;apiOK=true;if(Object.keys(o).length){unpack(o);try{localStorage.removeItem(LS)}catch(_){}render();applyLinks()}}).catch(()=>{});
const ED={
  schedule:[['date','Date','date'],['title','Title'],['text','Details'],['link','Link (https://…)','url']],
  concerts:[['date','Date','date'],['when','Date label, optional (e.g. Spring 25)'],['title','Title'],['text','Details'],['link','Link (https://…)','url']],
  works:[['title','Title'],['jp','Japanese title'],['year','Year'],['inst','Instrumentation']]};
const TXT=[['intro','Description',1],['email','Email'],['scoreText','Scores text',1]];
const inp=(f,lab,ty,v,attr)=>ty==='area'?`<textarea ${attr} aria-label="${esc(lab)}" placeholder="${esc(lab)}" rows="3">${esc(v)}</textarea>`:`<input type="${ty||'text'}" ${attr} aria-label="${esc(lab)}" placeholder="${esc(lab)}" value="${esc(v)}">`;
PANELS.settings=s=>`<h2 id="pT">Settings</h2>
<h3>Text</h3><div class="ed1">${TXT.map(([k,l,a])=>`<label>${esc(l)}${inp(k,l,a?'area':'text',s[k]||'',`data-s="${k}"`)}</label>`).join('')}
<label>Prices${['solo','chamber','orch'].map(k=>inp(k,k,'text',s.prices[k]||'',`data-p="${k}"`)).join('')}</label></div>
${Object.keys(ED).map(k=>`<h3>${k[0].toUpperCase()+k.slice(1)}</h3><div class="ed" data-k="${k}">${s[k].map((r,i)=>`<div class="er">${ED[k].map(([f,l,ty])=>inp(f,l,ty,r[f]||'',`data-f="${f}"`)).join('')}<button type="button" data-del="${k}" data-i="${i}" aria-label="Delete row">×</button></div>`).join('')}</div><p class="sbtn"><button type="button" data-add="${k}">Add</button></p>`).join('')}
<h3>Picture links</h3><p>A picture with a link opens it when clicked. A picture without one just falls.</p><ul class="set">${s.flags.map((f,i)=>{const src=flagSrc(f);return `<li><span class="th">${/\.mp4$/.test(src)?`<video src="${esc(src)}#t=1" muted playsinline preload="auto"></video>`:`<img src="${esc(src)}" alt="">`}</span><input type="url" data-i="${i}" placeholder="https://… (empty = falls)" value="${esc(f.link||'')}" aria-label="Link for picture ${i+1}"></li>`}).join('')}</ul>
${apiOK?`<label class="pw">Password<input type="password" id="sPw" autocomplete="current-password" value="${esc(sessionStorage.getItem('ns-pw')||'')}"></label>`:''}<p class="sbtn"><button type="button" id="sSave">Save</button><button type="button" id="sDl">Download index.html</button><button type="button" id="sReset">Undo my changes</button><span id="sMsg"></span></p><p>${apiOK?'Save puts the changes on the live site straight away.':'Save keeps the changes in this browser only. To put them on the real site, download index.html and upload it to GitHub over the old one.'}</p>`;
function readAll(){let bad=0;const chk=el=>{const v=el.value.trim();if(v&&!safeUrl(v)){bad++;el.style.borderColor='#c33';return null}el.style.borderColor='';return v};
  document.querySelectorAll('.ed1 [data-s]').forEach(el=>S[el.dataset.s]=el.value.trim());
  document.querySelectorAll('.ed1 [data-p]').forEach(el=>S.prices[el.dataset.p]=el.value.trim());
  document.querySelectorAll('.ed').forEach(box=>{const k=box.dataset.k;S[k]=[...box.querySelectorAll('.er')].map(er=>{const r={};er.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;const v=f==='link'?chk(el):el.value.trim();if(v)r[f]=v});return r}).filter(r=>Object.keys(r).length)});
  document.querySelectorAll('.set input').forEach(el=>{const v=chk(el);if(v===null)return;const f=S.flags[+el.dataset.i];if(v)f.link=v;else delete f.link});
  return bad}
function applyLinks(){cloths.forEach(c=>{const f=S.flags[c.i];c.link=safeUrl(f&&f.link)})}
const keepScroll=fn=>{const y=$('panel').scrollTop;fn();render();$('panel').scrollTop=y};
document.addEventListener('click',e=>{const tg=e.target;
  if(tg.dataset&&tg.dataset.add){keepScroll(()=>{readAll();S[tg.dataset.add].unshift({})})}
  if(tg.dataset&&tg.dataset.del){keepScroll(()=>{readAll();S[tg.dataset.del].splice(+tg.dataset.i,1)})}
  if(tg.id==='sSave'){const bad=readAll();applyLinks();$('intro').textContent=S.intro;const warn=bad?' Links must start with https:// (red boxes were not saved).':'';
    if(apiOK){const pw=($('sPw')||{}).value||'';try{sessionStorage.setItem('ns-pw',pw)}catch(_){}$('sMsg').textContent=' Saving…';

  },true);

}
